    <section class="lk">
      <div class="card form">
        <div class="card-title"><h2>Content</h2><div class="row"><button class="btn small" id="reset">Example</button></div></div>
        <div class="grid g2"><label class="field"><span>Product name</span><input id="name" /></label><label class="field"><span>Eyebrow</span><input id="eyebrow" /></label></div>
        <label class="field"><span>Headline (wrap a word in *stars* for gradient)</span><input id="tagline" /></label>
        <label class="field"><span>Subheadline</span><textarea id="sub" rows="2"></textarea></label>
        <div class="grid g2"><label class="field"><span>CTA</span><input id="cta" /></label><label class="field"><span>CTA link</span><input id="ctaUrl" /></label><label class="field"><span>Second CTA</span><input id="cta2" /></label><label class="field"><span>Second link</span><input id="cta2Url" /></label></div>
        <label class="field"><span>Features (Title - description, one per line)</span><textarea id="features" rows="5"></textarea></label>
        <label class="field"><span>FAQ (Question? Answer, one per line)</span><textarea id="faq" rows="3"></textarea></label>
        <div class="grid g3"><label class="field"><span>Plan</span><input id="planName" /></label><label class="field"><span>Price</span><input id="price" /></label><label class="field"><span>Period</span><input id="period" /></label></div>
        <label class="field"><span>Perks (one per line)</span><textarea id="perks" rows="3"></textarea></label>
        <label class="field"><span>Footer note</span><input id="footer" /></label>
        <div class="field"><span>Theme</span><div class="chips" id="themes"></div></div>
        <div class="row secs"><label class="check"><input type="checkbox" data-s="features" checked /> Features</label><label class="check"><input type="checkbox" data-s="pricing" /> Pricing</label><label class="check"><input type="checkbox" data-s="faq" checked /> FAQ</label><label class="check"><input type="checkbox" data-s="cta" checked /> Final CTA</label></div>
      </div>
      <div class="card prev">
        <div class="card-title"><h2>Preview</h2><div class="row"><div class="tabs" id="dev"><button class="on" data-v="100%">Desktop</button><button data-v="390px">Mobile</button></div><button class="btn small" id="copy">Copy HTML</button><button class="btn small primary" id="dl">Download index.html</button></div></div>
        <div class="frame-wrap"><iframe id="frame" title="Landing page preview" sandbox="allow-same-origin"></iframe></div>
      </div>
    </section>
